<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Actividades Camp 2027</title>
  <meta name="description" content="Camino hacia el campamento: progreso y ranking de participantes." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="app-header">
    <div class="app-header__top">
      <div class="logo-wrap">
        <div class="logo-badge">🏕️</div>
        <img id="logoImg" class="logo-img" alt="Logo del campamento" />
      </div>
      <div>
        <h1 class="app-title">ACTIVIDADES CAMP 2027</h1>
        <p class="app-subtitle">Camino al campamento</p>
      </div>
    </div>

    <!-- Puede haber una o varias actividades activas a la vez; app.js
         agrega una .actividad-card por cada una dentro de este contenedor. -->
    <div class="actividades-contenedor" id="actividadesContenedor">
      <div class="actividad-card">
        <span class="actividad-card__nombre">Cargando...</span>
      </div>
    </div>
  </header>

  <div class="contenido-principal">
    <!-- ===================== MAPA ===================== -->
    <section class="mapa-section" aria-label="Mapa de progreso">
      <div class="mapa-wrapper" id="mapaWrapper">
        <img class="mapa-imagen" src="assets/mapa.png" alt="Mapa del camino hacia el campamento" />
        <!-- Líneas de depuración: muestran los 12 carriles invisibles.
             Ver MOSTRAR_CARRILES_DEBUG en js/app.js para ocultarlas. -->
        <svg class="mapa-lineas-carriles" id="lineasCarriles" viewBox="0 0 853 1844" preserveAspectRatio="none"></svg>
        <!-- Muros de depuración del deambular (15% / 85% del ancho de la
             imagen). Ver MOSTRAR_MUROS_DEAMBULAR_DEBUG en js/app.js. -->
        <div class="mapa-muro-deambular mapa-muro-deambular--izquierda" id="muroDeambularIzquierdo"></div>
        <div class="mapa-muro-deambular mapa-muro-deambular--derecha" id="muroDeambularDerecho"></div>
        <div class="mapa-capa-participantes" id="capaParticipantes"></div>
      </div>
    </section>

    <!-- ===================== RANKING ===================== -->
    <section class="ranking-section" aria-label="Ranking de participantes">
      <h2 class="ranking-titulo">🏆 Ranking</h2>
      <ul class="ranking-lista" id="rankingLista"></ul>
      <p class="estado-vacio" id="rankingVacio" style="display:none;">
        Todavía no hay participantes registrados.
      </p>
    </section>
  </div>

  <!-- Acceso discreto al panel administrador -->
  <a class="admin-link" href="admin.html" title="Acceso administrador" aria-label="Acceso administrador">⚙️</a>

  <script type="module" src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
